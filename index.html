<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marina og HavneNyheder – danske marinaer og lystbådehavne</title>
<meta name="description" content="Nyheder om danske marinaer og lystbådehavne – opdateret automatisk hver time.">
<meta name="theme-color" content="#0b5fa5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marina og HavneNyheder">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f7fa; --card: #ffffff; --border: #e2e9f0; --border2: #c8d4e0;
    --text: #1a2332; --muted: #5b6b7f; --muted2: #8593a5;
    --accent: #0b5fa5; --accent-dark: #0a5290; --title: #0b3d66;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161f; --card: #1a2230; --border: #263143; --border2: #35435a;
      --text: #e3e9f2; --muted: #93a3b8; --muted2: #6d7d93;
      --accent: #4d9fdd; --accent-dark: #63aee6; --title: #a8cdec;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    padding: 20px calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 12px;
  }
  header.top h1 { font-size: 22px; font-weight: 700; min-width: 0; }
  .tools { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  /* Ikonknapper: søg og filter */
  .iconbtn {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; padding: 0; border: 1px solid var(--border2); border-radius: 10px;
    background: var(--card); color: var(--muted); cursor: pointer; list-style: none;
    -webkit-tap-highlight-color: transparent; transition: color .12s, border-color .12s;
  }
  .iconbtn::-webkit-details-marker { display: none; }
  .iconbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .iconbtn:hover { color: var(--accent); border-color: var(--accent); }
  .iconbtn.on, .dd[open] > .iconbtn { color: #fff; background: var(--accent); border-color: var(--accent); }
  /* Prik der viser at et filter eller en søgning er aktiv */
  .iconbtn.active::after {
    content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px;
    border-radius: 50%; background: var(--accent); border: 1.5px solid var(--card);
  }
  .iconbtn.on.active::after { background: #fff; border-color: var(--accent); }
  /* Sponsorbjælke. Logoet findes kun i hvid, derfor den blå bund. */
  .sponsor {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    background: var(--accent); color: #fff; text-decoration: none;
    border-radius: 10px; padding: 10px 16px; margin-bottom: 12px;
    -webkit-tap-highlight-color: transparent; transition: background .12s;
  }
  .sponsor:hover { background: var(--accent-dark); }
  .sponsor img { height: 26px; width: auto; display: block; flex: 0 0 auto; }
  .sponsor span {
    font-size: 13px; font-weight: 600; letter-spacing: .01em;
  }
  /* Søgefeltet er skjult indtil man trykker på lupen */
  .searchrow { display: none; margin-bottom: 10px; }
  .searchrow.open { display: flex; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .controls.col { flex-direction: column; align-items: stretch; gap: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; white-space: nowrap;
    border: 1px solid var(--border2); background: var(--card); border-radius: 16px; padding: 5px 12px;
    font-size: 13px; line-height: 1.25; cursor: pointer; user-select: none; color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lbl { font-size: 11px; color: var(--muted2); text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; }
  input.search {
    flex: 1; min-width: 160px; border: 1px solid var(--border2); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; background: var(--card); color: var(--text);
  }
  input.search:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  /* Emne-dropdown */
  .dd { position: relative; }
  .dd > summary { list-style: none; user-select: none; }
  .ddpanel {
    position: absolute; z-index: 20; top: calc(100% + 6px); right: 0; min-width: 268px; max-width: 84vw;
    background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,.14);
    max-height: calc(100vh - 120px); overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .ddtop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
  .ddtop.ddsep { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .ddall { font-size: 12px; color: var(--accent); cursor: pointer; white-space: nowrap; }
  .ddall:hover { text-decoration: underline; }
  .ghead {
    font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin: 18px 0 8px 2px;
  }
  /* Billedet flyder til venstre, så teksten står ved siden af og fortsætter nedenunder. */
  a.card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 8px; display: block; overflow: hidden;
    min-height: 44px; text-decoration: none; color: inherit;
    -webkit-tap-highlight-color: transparent; transition: border-color .12s, background .12s;
  }
  a.card:hover { border-color: var(--accent); }
  a.card:active { background: var(--bg); border-color: var(--accent); }
  .thumb {
    float: left; width: 168px; height: 124px; margin: 2px 14px 6px 0;
    object-fit: cover; border-radius: 8px; background: var(--border);
  }
  /* Dato og kilde står nederst, adskilt af en tynd linje. Blok (ikke flex),
     så linjerne selv viger for det flydende billede. */
  .meta {
    font-size: 12px; color: var(--muted); line-height: 1.7; clear: none;
    margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .meta .dot { margin: 0 6px; color: var(--muted2); }
  .card .title { color: var(--title); font-weight: 600; font-size: 15px; line-height: 1.35; display: block; }
  a.card:hover .title { text-decoration: underline; }
  .summary { font-size: 13px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
  .sentinel { height: 1px; }
  .more {
    display: block; width: 100%; margin: 12px 0 4px; padding: 12px; border: 1px solid var(--border2);
    background: var(--card); color: var(--accent); border-radius: 10px; font-size: 14px;
    font-weight: 600; cursor: pointer;
  }
  .loading, .empty { text-align: center; padding: 40px; color: var(--muted); }
  .spinner {
    display: inline-block; width: 22px; height: 22px; border: 3px solid var(--border2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { margin-top: 24px; font-size: 12px; color: var(--muted2); text-align: center; }
  footer a { color: var(--muted); }
  @media (max-width: 560px) {
    body {
      padding: 12px calc(12px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    }
    header.top h1 { font-size: 19px; }
    .sponsor { gap: 10px; padding: 9px 12px; }
    .sponsor img { height: 22px; }
    .sponsor span { font-size: 12px; }
    .chip { font-size: 12px; padding: 6px 11px; }
    input.search { width: 100%; flex: 1 1 100%; font-size: 16px; }
    .thumb { width: 136px; height: 104px; margin: 2px 11px 6px 0; }
    .card .title { font-size: 14px; }
    .ghead { margin: 14px 0 6px 2px; }
    /* Emner: alle synlige på én skærm – chips fylder rækkerne ud, ingen scroll */
    .ddpanel .chips { gap: 5px; }
    .ddpanel .chip {
      flex: 1 1 auto; justify-content: center; font-size: 12px;
      padding: 7px 8px; min-height: 32px;
    }
  }
  @media (max-width: 360px) {
    .ddpanel .chip { font-size: 11px; padding: 7px 6px; letter-spacing: -.01em; }
    .thumb { width: 118px; height: 90px; margin-right: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>&#9875; Marina og HavneNyheder</h1>
    <div class="tools" id="tools" style="display:none">
      <button class="iconbtn" id="searchBtn" type="button" aria-label="S&oslash;g i overskrifter" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>
      </button>
      <details class="dd" id="catDd">
        <summary class="iconbtn" id="catBtn" aria-label="Filtrer p&aring; emne" title="Filtrer p&aring; emne">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
        </summary>
        <div class="ddpanel">
          <div class="ddtop">
            <span class="lbl">Emner</span>
            <span class="ddall" id="catAll">V&aelig;lg alle</span>
          </div>
          <div class="chips" id="catChips"></div>
          <div class="ddtop ddsep">
            <span class="lbl">Kilder</span>
            <span class="ddall" id="srcAll">V&aelig;lg alle</span>
          </div>
          <div class="chips" id="srcChips"></div>
        </div>
      </details>
    </div>
  </header>
  <a class="sponsor" href="https://assens-marina.dk/" target="_blank" rel="noopener">
    <img src="https://assens-marina.dk/wp-content/uploads/2026/07/assens-marina-logo-hvid.svg"
         alt="Assens Marina" width="150" height="33" loading="lazy">
    <span>- Placeret i MidtpunktsDanmark</span>
  </a>
  <div class="searchrow" id="srcRow">
    <input class="search" id="q" type="search" placeholder="S&oslash;g i overskrifter&hellip;">
  </div>
  <div id="list"><div class="loading"><div class="spinner"></div><div>Henter nyheder&hellip;</div></div></div>
  <footer>Kilder tilf&oslash;jes og fjernes i
    <a href="https://github.com/alexhansenfyn-art/marina-nyheder/blob/main/sources.json">sources.json</a>.
    Opdateres automatisk hver time via GitHub Actions.
    Resum&eacute;er og kategorier genereres af DeepSeek AI og kan indeholde fejl.</footer>
</div>
<script>
(function(){
  var DA_SHORT = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
  var LEGACY = { m: "Minbåd.dk", o: "Motorbådsnyt", f: "FLID Havne" };
  var CAT_ORDER = ["Havnepriser","Havneliv","Sikkerhed","Kapsejlads","Tursejlads",
                   "Udstyr & både","Jubilæum","Andet"];
  var state = { items: [], cats: [], sources: [], catOff: {}, srcOff: {}, q: "" };
  var BATCH = 20;
  var view = { items: [], shown: 0, lastGroup: null };

  try {
    var saved = JSON.parse(localStorage.getItem("marina-nyheder-prefs5") || "{}");
    if (saved.catOff) state.catOff = saved.catOff;
    if (saved.srcOff) state.srcOff = saved.srcOff;
  } catch (e) {}

  function savePrefs() {
    try {
      localStorage.setItem("marina-nyheder-prefs5",
        JSON.stringify({ catOff: state.catOff, srcOff: state.srcOff }));
    } catch (e) {}
  }

  function fmtDate(iso) {
    if (!iso) return "–";
    var p = iso.split("-");
    return (+p[2]) + ". " + DA_SHORT[+p[1]-1] + " " + p[0];
  }

  function isoDaysAgo(n) {
    var d = new Date(); d.setDate(d.getDate() - n);
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

  function groupOf(iso, T0, T1, T7) {
    if (!iso) return "Tidligere";
    if (iso >= T0) return "I dag";
    if (iso >= T1) return "I går";
    if (iso >= T7) return "Denne uge";
    return "Tidligere";
  }

  function card(it) {
    var html = '<a class="card" href="' + esc(it.url) + '" target="_blank" rel="noopener">';
    if (it.img) html += '<img class="thumb" loading="lazy" decoding="async" width="168" height="124" ' +
      'src="' + esc(it.img) + '" alt="" onerror="this.style.display=\'none\'">';
    html += '<span class="title">' + esc(it.title) + '</span>' +
      (it.sum ? '<div class="summary">' + esc(it.sum) + '</div>' : '') +
      '<div class="meta">' + fmtDate(it.date) +
      '<span class="dot">&middot;</span>' + esc(it.source) +
      '</div>' +
      '</a>';
    return html;
  }

  function render() {
    var list = document.getElementById("list");
    var q = state.q.toLowerCase();
    var items = state.items.filter(function(it){
      if (state.catOff[it.cat || "Andet"]) return false;
      if (state.srcOff[it.source]) return false;
      if (q && (it.title + " " + (it.sum || "")).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    if (!items.length) {
      list.innerHTML = '<div class="empty">Ingen nyheder matcher filtrene.</div>';
      return;
    }
    // Render i portioner: mobilen skal ikke bygge 150+ kort på én gang.
    view.items = items;
    view.shown = 0;
    view.lastGroup = null;
    list.innerHTML = "";
    appendBatch();
  }

  function appendBatch() {
    var list = document.getElementById("list");
    var T0 = isoDaysAgo(0), T1 = isoDaysAgo(1), T7 = isoDaysAgo(7);
    var slice = view.items.slice(view.shown, view.shown + BATCH);
    if (!slice.length) return;
    var html = "";
    slice.forEach(function(it){
      var g = groupOf(it.date, T0, T1, T7);
      if (g !== view.lastGroup) { html += '<div class="ghead">' + g + '</div>'; view.lastGroup = g; }
      html += card(it);
    });
    view.shown += slice.length;

    var old = document.getElementById("tail");
    if (old) old.remove();
    list.insertAdjacentHTML("beforeend", html);

    if (view.shown < view.items.length) {
      var rest = view.items.length - view.shown;
      list.insertAdjacentHTML("beforeend",
        '<div id="tail"><button class="more" id="moreBtn">Vis ' +
        Math.min(BATCH, rest) + ' flere (' + rest + ' tilbage)</button><div class="sentinel"></div></div>');
      document.getElementById("moreBtn").addEventListener("click", appendBatch);
      observeTail();
    }
  }

  var io = null;
  function observeTail() {
    var s = document.querySelector("#tail .sentinel");
    if (!s || !("IntersectionObserver" in window)) return;
    if (!io) {
      io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if (e.isIntersecting) { io.disconnect(); appendBatch(); } });
      }, { rootMargin: "600px 0px" });
    }
    io.disconnect();
    io.observe(s);
  }

  function buildChips(holderId, values, offMap) {
    var holder = document.getElementById(holderId);
    holder.innerHTML = "";
    values.forEach(function(v){
      var ch = document.createElement("span");
      ch.className = "chip" + (offMap[v] ? "" : " on");
      ch.setAttribute("role", "checkbox");
      ch.textContent = v;
      ch.addEventListener("click", function(){
        offMap[v] = !offMap[v];
        ch.classList.toggle("on", !offMap[v]);
        ch.setAttribute("aria-checked", String(!offMap[v]));
        savePrefs(); updateFilterDot(); render();
      });
      ch.setAttribute("aria-checked", String(!offMap[v]));
      holder.appendChild(ch);
    });
  }

  // Prik på filter-ikonet når et emne ELLER en kilde er filtreret væk
  function updateFilterDot() {
    var catOn = state.cats.filter(function(c){ return !state.catOff[c]; }).length;
    var srcOn = state.sources.filter(function(s){ return !state.srcOff[s]; }).length;
    var filtreret = catOn !== state.cats.length || srcOn !== state.sources.length;
    document.getElementById("catBtn").classList.toggle("active", filtreret);
  }

  // "Vælg alle" slår alle til – eller alle fra, hvis alle allerede er valgt.
  // Slår op i state ved klik (ikke ved opsætning), så den altid rammer rigtigt.
  function wireVaelgAlle(linkId, holderId, listKey, offKey) {
    document.getElementById(linkId).addEventListener("click", function(){
      var values = state[listKey], offMap = state[offKey];
      var allOn = values.every(function(v){ return !offMap[v]; });
      values.forEach(function(v){ offMap[v] = allOn; });
      buildChips(holderId, values, offMap);
      savePrefs(); updateFilterDot(); render();
    });
  }

  function wireControls() {
    var tools = document.getElementById("tools");
    tools.style.display = "";
    if (!state.cats.length && !state.sources.length) {
      document.getElementById("catDd").style.display = "none";
    }
    buildChips("catChips", state.cats, state.catOff);
    buildChips("srcChips", state.sources, state.srcOff);
    updateFilterDot();

    var row = document.getElementById("srcRow");
    var q = document.getElementById("q");
    var sBtn = document.getElementById("searchBtn");
    q.addEventListener("input", function(e){
      state.q = e.target.value;
      sBtn.classList.toggle("active", !!state.q);
      render();
    });
    // Lupen slår søgefeltet ud og ind. Lukkes den med tekst i, nulstilles søgningen.
    sBtn.addEventListener("click", function(){
      var open = row.classList.toggle("open");
      sBtn.classList.toggle("on", open);
      sBtn.setAttribute("aria-expanded", String(open));
      if (open) { q.focus(); }
      else if (state.q) { q.value = ""; state.q = ""; sBtn.classList.remove("active"); render(); }
    });
    q.addEventListener("keydown", function(e){
      if (e.key === "Escape") { sBtn.click(); sBtn.focus(); }
    });

    var dd = document.getElementById("catDd");
    wireVaelgAlle("catAll", "catChips", "cats", "catOff");
    wireVaelgAlle("srcAll", "srcChips", "sources", "srcOff");
    // Luk ved klik udenfor og på Escape.
    document.addEventListener("click", function(e){
      if (dd.open && !dd.contains(e.target)) dd.open = false;
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && dd.open) dd.open = false;
    });
  }

  fetch("news.json", { cache: "no-cache" })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data){
      state.items = (data.items || []).map(function(it){
        if (!it.source && it.src && LEGACY[it.src]) it.source = LEGACY[it.src];
        return it;
      }).filter(function(it){ return it.source; });
      var seenC = {}, seenS = {};
      state.items.forEach(function(it){
        if (it.cat) seenC[it.cat] = true;
        if (it.source) seenS[it.source] = true;
      });
      state.cats = CAT_ORDER.filter(function(c){ return seenC[c]; });
      state.sources = Object.keys(seenS).sort(function(a, b){
        return a.localeCompare(b, "da");
      });
      wireControls();
      render();
    })
    .catch(function(e){
      document.getElementById("list").innerHTML =
        '<div class="empty">Kunne ikke hente news.json (' + e.message + ').</div>';
    });

  // Service worker: gør siden installerbar og læsbar offline.
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
</html>
