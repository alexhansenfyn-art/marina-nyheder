name: Crawl marina nyheder

on:
  schedule:
    # Hver halve time. Bevidst 17 og 47 og ikke 0 og 30: GitHubs planlagte
    # koersler ligger i en lavprioritetskoe, og de runde minuttal er de mest
    # belastede, fordi alle andre ogsaa bruger dem. Skaeve minutter rammer
    # oftere igennem. Planlagte koersler er stadig "best effort" - de kan
    # blive forsinket eller sprunget over uden varsel.
    - cron: "17,47 * * * *"
  workflow_dispatch:        # kan ogsaa startes manuelt

# To koersler maa aldrig overlappe: de skriver til den samme news.json og
# pusher til main, og saa knaekker rebasen. Er en koersel i gang, staar den
# naeste i koe i stedet for at blive kasseret.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer afhængigheder
        run: pip install requests beautifulsoup4

      - name: Kør crawler
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python crawler.py

      - name: Vagthund - opret en sag hvis en kilde er gaaet i staa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s vagthund.txt ]; then
            # Kun én åben sag ad gangen, ellers kommer der en mail hver time
            aaben=$(gh issue list --state open --search "Vagthund in:title" --json number --jq 'length')
            if [ "$aaben" = "0" ]; then
              gh issue create \
                --title "Vagthund: en kilde har ikke leveret nyheder i en maaned" \
                --body-file vagthund.txt
            fi
          fi

      - name: Commit og push hvis der er nyt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json index.html sitemap.xml feed.xml
          git diff --cached --quiet && exit 0
          git commit -m "Opdater nyheder ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Push kan fejle, hvis en anden koersel naaede at pushe imens.
          # Proev igen med en frisk rebase i stedet for at lade koerslen doe.
          for forsoeg in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push mislykkedes (forsoeg $forsoeg), proever igen om 10 sekunder"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Kunne ikke pushe efter 3 forsoeg" >&2
          exit 1

