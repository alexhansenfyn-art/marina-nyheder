name: Crawl marina nyheder

on:
  schedule:
    - cron: "17 * * * *"   # hver time, 17 min over
  workflow_dispatch:        # kan også startes manuelt

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer afhængigheder
        run: pip install requests beautifulsoup4

      - name: Kør crawler
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python crawler.py

      - name: Commit og push hvis der er nyt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json index.html sitemap.xml
          git diff --cached --quiet || git commit -m "Opdater nyheder ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Hent evt. nye commits ind først, så et samtidigt commit ikke spolerer kørslen
          git pull --rebase origin main
          git push
