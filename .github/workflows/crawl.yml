name: Crawl marina nyheder

on:
  schedule:
    - cron: "17 * * * *"   # hver time, 17 min over
  workflow_dispatch:        # kan også startes manuelt

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer afhængigheder
        run: pip install requests beautifulsoup4

      - name: Kør crawler
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python crawler.py

      - name: Vagthund - opret en sag hvis en kilde er gaaet i staa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s vagthund.txt ]; then
            # Kun én åben sag ad gangen, ellers kommer der en mail hver time
            aaben=$(gh issue list --state open --search "Vagthund in:title" --json number --jq 'length')
            if [ "$aaben" = "0" ]; then
              gh issue create \
                --title "Vagthund: en kilde har ikke leveret nyheder i en maaned" \
                --body-file vagthund.txt
            fi
          fi

      - name: Commit og push hvis der er nyt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json index.html sitemap.xml feed.xml
          git diff --cached --quiet || git commit -m "Opdater nyheder ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Hent evt. nye commits ind først, så et samtidigt commit ikke spolerer kørslen
          git pull --rebase origin main
          git push
