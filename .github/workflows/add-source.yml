name: Tilføj kilde fra issue

on:
  issues:
    types: [opened]

# Samme gruppe som den planlagte crawler: begge skriver til nyhedsfilerne.
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  add:
    # Kun repo-ejeren må tilføje kilder, og kun via "Ny kilde"-issues
    if: github.event.issue.user.login == github.repository_owner && contains(github.event.issue.title, 'Ny kilde')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer afhængigheder
        run: pip install requests beautifulsoup4

      - name: Valider og tilføj kilde
        id: add
        run: |
          if python add_source.py; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Kør crawler med den nye kilde
        if: steps.add.outputs.ok == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python crawler.py

      - name: Commit og push
        id: publish
        if: steps.add.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json news.json news-arkiv.json index.html sitemap.xml feed.xml
          git diff --cached --quiet && exit 0
          git commit -m "Tilføj kilde fra issue #$ISSUE_NUMBER"
          for forsoeg in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push mislykkedes (forsoeg $forsoeg), proever igen om 10 sekunder"
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "Kunne ikke pushe efter 3 forsoeg" >&2
          exit 1

      - name: Svar og luk issue
        if: success() && (steps.add.outputs.ok == 'false' || steps.publish.outcome == 'success')
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat comment.txt 2>/dev/null || echo 'Der skete en uventet fejl - se workflow-loggen.')"
